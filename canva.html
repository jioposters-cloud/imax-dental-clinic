<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAX Dental Clinic - Dr. Ankit M. Patel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
        }

        /* Hide Canva credit and branding */
        iframe {
            display: block !important;
            width: 100% !important;
            height: auto !important;
            min-height: 100vh;
            border: none !important;
        }

        /* Hide Canva footer/credit section */
        .canva-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        /* Responsive iframe wrapper */
        .canva-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 0;
        }

        /* Hide the "Designed with Canva" link and credit */
        a[href*="canva.com"] {
            display: none !important;
        }

        div:has(> a[href*="canva.com"]) {
            display: none !important;
        }

        /* Desktop view - full height */
        @media (min-width: 1024px) {
            .canva-container iframe {
                min-height: 100vh;
            }
        }

        /* Tablet view - responsive */
        @media (max-width: 1023px) and (min-width: 768px) {
            .canva-container iframe {
                min-height: 100vh;
            }
        }

        /* Mobile view - fully responsive */
        @media (max-width: 767px) {
            .canva-container iframe {
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <div class="canva-container">
        <iframe 
            src="https://www.canva.com/design/DAG55eK6iUM/Fur3b5ESt-49hOgCJv-MDQ/view?embed" 
            allowfullscreen="allowfullscreen" 
            allow="fullscreen"
            loading="lazy">
        </iframe>
    </div>

    <script>
        // Remove Canva branding when iframe loads
        window.addEventListener('load', function() {
            const iframe = document.querySelector('iframe');
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                // Hide Canva credit/footer
                const canvaLinks = iframeDoc.querySelectorAll('a[href*="canva.com"]');
                canvaLinks.forEach(link => {
                    link.style.display = 'none';
                    if (link.parentElement) {
                        link.parentElement.style.display = 'none';
                    }
                });
            } catch (e) {
                // Cross-origin restriction - Canva prevents this
                console.log('Cannot access iframe content due to cross-origin policy');
            }
        });

        // Make iframe responsive
        function makeIframeResponsive() {
            const iframe = document.querySelector('iframe');
            if (iframe) {
                // Maintain aspect ratio on different screen sizes
                if (window.innerWidth <= 480) {
                    iframe.style.minHeight = '150vh';
                } else if (window.innerWidth <= 768) {
                    iframe.style.minHeight = '120vh';
                } else {
                    iframe.style.minHeight = '100vh';
                }
            }
        }

        makeIframeResponsive();
        window.addEventListener('resize', makeIframeResponsive);
    </script>
</body>
</html>
